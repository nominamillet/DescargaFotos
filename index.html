<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exportador de Imágenes Drive</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        .card-container {
            background-color: #e2f7e5;
            border-radius: 28px;
            padding: 35px 40px;
            width: 100%;
            max-width: 750px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

            .form-group label {
                width: 160px;
                font-weight: bold;
                font-size: 16px;
                color: #000;
            }

            .form-group input {
                flex: 1;
                padding: 10px 16px;
                font-size: 15px;
                border: 2px solid #000;
                border-radius: 12px;
                background-color: #fff;
                outline: none;
            }

                .form-group input[readonly] {
                    cursor: pointer;
                    background-color: #fcfcfc;
                }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }

        .btn {
            background-color: #12557a;
            color: white;
            border: 2px solid #000;
            border-radius: 16px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 180px;
            text-align: center;
            transition: background-color 0.2s, transform 0.1s;
        }

            .btn:hover {
                background-color: #0d3e5a;
            }

            .btn:active {
                transform: scale(0.98);
            }

            .btn:disabled {
                background-color: #8faab8;
                cursor: not-allowed;
            }

        #status {
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            color: #333;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="form-group">
            <label for="driveUrl">carpera Drive</label>
            <input type="text" id="driveUrl" value="https://drive.google.com/drive/folders/1yoS_hM1Ul6qS7REUO20MHiKbVmCvRC-K">
        </div>

        <div class="form-group">
            <label for="localFolder">carpera Local</label>
            <input type="text" id="localFolder" value="C:\Users\upernom04\Documents\COMPARTIDA" readonly onclick="selectLocalDirectory()" title="Haz clic para seleccionar la carpeta local en tu PC">
        </div>

        <div class="button-group">
            <button class="btn" id="btnExport" onclick="exportToPC()">Exportar a<br>PC</button>
            <button class="btn" id="btnDelete" onclick="deleteDriveImages()">Borrar Imagen<br>Drive</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
            const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwIpHyRtAbQycFdy-rvmVIBJuD-Bt3KLeMsiQAHDoaPDrtfWb6TXrIh6VBzQWY4XOYq/exec';

            let localDirectoryHandle = null;

            async function selectLocalDirectory() {
              try {
                if ('showDirectoryPicker' in window) {
                  localDirectoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                  document.getElementById('localFolder').value = localDirectoryHandle.name;
                  showStatus(`Carpeta local seleccionada: ${localDirectoryHandle.name}`);
                } else {
                  alert('Tu navegador no soporta el selector directo de carpetas. Se utilizarán descargas estándar.');
                }
              } catch (err) {
                if (err.name !== 'AbortError') {
                  console.log('Selección cancelada o no permitida', err);
                }
              }
            }

            // Asegura permiso de escritura mientras hay activación del usuario (al hacer clic)
            async function asegurarPermisoCarpeta() {
              if (!('showDirectoryPicker' in window)) return null;

              if (!localDirectoryHandle) {
                localDirectoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                document.getElementById('localFolder').value = localDirectoryHandle.name;
              }

              const opts = { mode: 'readwrite' };
              if (localDirectoryHandle.queryPermission) {
                const estado = await localDirectoryHandle.queryPermission(opts);
                if (estado !== 'granted') {
                  const solicitado = await localDirectoryHandle.requestPermission(opts);
                  if (solicitado !== 'granted') {
                    throw new Error('No se otorgó permiso de escritura a la carpeta local.');
                  }
                }
              }
              return localDirectoryHandle;
            }

            function descargarArchivoFallback(byteArray, mimeType, fileName) {
              const blob = new Blob([byteArray], { type: mimeType });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = fileName;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
            }

            function showStatus(message, isError = false) {
              const statusDiv = document.getElementById('status');
              statusDiv.textContent = message;
              statusDiv.style.color = isError ? '#d9534f' : '#2e7d32';
            }

            function base64ToUint8Array(base64) {
              const binaryString = window.atob(base64);
              const len = binaryString.length;
              const bytes = new Uint8Array(len);
              for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
              }
              return bytes;
            }

            async function exportToPC() {
              const driveUrl = document.getElementById('driveUrl').value.trim();
              if (!driveUrl) {
                alert('Por favor ingresa la URL de la carpeta de Google Drive.');
                return;
              }

              document.getElementById('btnExport').disabled = true;

              try {
                // 1. Pedir / renovar permiso de carpeta INMEDIATAMENTE al hacer clic (con user activation activa)
                let dirHandle = null;
                if ('showDirectoryPicker' in window) {
                  dirHandle = await asegurarPermisoCarpeta();
                }

                // 2. Consultar archivos a Apps Script
                showStatus('Obteniendo imágenes desde Google Drive...');
                const response = await fetch(`${APPS_SCRIPT_URL}?action=getFiles&folderUrl=${encodeURIComponent(driveUrl)}`);
                const data = await response.json();

                if (data.status !== 'success') {
                  throw new Error(data.message || 'Error al obtener archivos');
                }

                const files = data.files;
                if (files.length === 0) {
                  showStatus('No se encontraron imágenes en la carpeta indicada.');
                  return;
                }

                showStatus(`Procesando ${files.length} imágenes...`);

                const nameCountMap = {};

                for (let file of files) {
                  let nameKey = file.baseName;

                  if (!nameCountMap[nameKey]) {
                    nameCountMap[nameKey] = 1;
                  } else {
                    nameCountMap[nameKey]++;
                  }

                  const count = nameCountMap[nameKey];
                  const finalFileName = count === 1
                    ? `${file.baseName}${file.extension}`
                    : `${file.baseName} (${count - 1})${file.extension}`;

                  const byteArray = base64ToUint8Array(file.base64);

                  if (dirHandle) {
                    try {
                      const fileHandle = await dirHandle.getFileHandle(finalFileName, { create: true });
                      const writable = await fileHandle.createWritable();
                      await writable.write(byteArray);
                      await writable.close();
                    } catch (writeErr) {
                      // Si el navegador revocó el permiso a mitad del proceso, usar descarga estándar
                      console.warn('Fallback a descarga estándar:', writeErr);
                      descargarArchivoFallback(byteArray, file.mimeType, finalFileName);
                    }
                  } else {
                    descargarArchivoFallback(byteArray, file.mimeType, finalFileName);
                  }
                }

                showStatus(`¡Éxito! Se exportaron ${files.length} imágenes a la carpeta local.`);
              } catch (err) {
                if (err.name === 'AbortError') {
                  showStatus('Selección de carpeta cancelada.', true);
                } else {
                  showStatus(`Error: ${err.message}`, true);
                }
              } finally {
                document.getElementById('btnExport').disabled = false;
              }
            }

            async function deleteDriveImages() {
              const driveUrl = document.getElementById('driveUrl').value.trim();
              if (!driveUrl) {
                alert('Por favor ingresa la URL de la carpeta de Google Drive.');
                return;
              }

              if (!confirm('¿Estás seguro de que deseas eliminar todas las imágenes de la carpeta de Google Drive?')) {
                return;
              }

              showStatus('Borrando imágenes de Google Drive...');
              document.getElementById('btnDelete').disabled = true;

              try {
                const response = await fetch(APPS_SCRIPT_URL, {
                  method: 'POST',
                  body: JSON.stringify({
                    action: 'deleteFiles',
                    folderUrl: driveUrl
                  })
                });

                const data = await response.json();

                if (data.status === 'success') {
                  showStatus(`Se borraron ${data.deletedCount} imágenes de la carpeta de Drive.`);
                } else {
                  throw new Error(data.message);
                }
              } catch (err) {
                showStatus(`Error al borrar imágenes: ${err.message}`, true);
              } finally {
                document.getElementById('btnDelete').disabled = false;
              }
            }
    </script>
</body>
</html>
